spring.application.name=api-management-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/api_management_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

info.app.name = api-management-service
info.app.description =Api management carries all the configurations of idempotent(uniques entry) api, rate limiting and route storage...

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.repair-on-migrate=true

security.jwt.secret=change-me-to-a-long-random-secret-key-for-api-signing
security.jwt.expiration-seconds=3600